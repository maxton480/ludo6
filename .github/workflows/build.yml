name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir www && cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6
          npx cap init "Ludo 6" com.ludo6.game --web-dir www
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Set app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import glob, os
          ic = Image.open("icon.png").convert("RGBA")
          res = "android/app/src/main/res"
          for f in glob.glob(res + "/mipmap-anydpi*/ic_launcher*.xml"):
              os.remove(f)
          for d, s in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              out = ic.resize((s, s), Image.LANCZOS)
              for n in ("ic_launcher", "ic_launcher_round", "ic_launcher_foreground"):
                  out.save(res + "/mipmap-" + d + "/" + n + ".png")
          PY
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ludo6-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
